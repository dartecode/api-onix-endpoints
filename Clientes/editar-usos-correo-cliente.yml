info:
  name: editar-usos-correo-cliente
  type: http
  seq: 9
http:
  method: PATCH
  url: "{{URL}}/api/v1/clientes/1/correos/1"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "usos": ["notificaciones", "reportes", "alertas"]
      }
  auth:
    type: bearer
    token: "{{TOKEN}}"
docs: |-
  Reemplazar 1 y 1 en la URL por idCliente e idCorreo.
  cliente.gestionarCorreos. Cambia los usos de un correo con origen = onix.
  200: ClienteCorreoDto en data; 422 EMAIL_FROM_PERSEO si el correo proviene
  de Perseo; 404 CLIENT_NOT_FOUND / CLIENT_EMAIL_NOT_FOUND.
