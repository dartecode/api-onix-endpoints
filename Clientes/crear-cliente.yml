info:
  name: crear-cliente
  type: http
  seq: 3
http:
  method: POST
  url: "{{URL}}/api/v1/clientes"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: '{ "tipoIdentificacion": "ruc", "identificacion": "1712345675001", "razonSocial": "Cliente de prueba", "sector": "Retail" }'
  auth:
    type: bearer
    token: "{{TOKEN}}"
docs: |-
  cliente.crear y perfil interno. tipoIdentificacion admite ruc (13 dígitos),
  cedula (10 dígitos) o pasaporte (5 a 20 caracteres alfanuméricos en mayúsculas);
  el verificador de RUC/cédula se valida en el SP. sector opcional. 201:
  cliente en data con tipoIdentificacion, identificacion, estadoCambiadoEn y
  motivoCambioEstado; 409: tipo + identificación duplicados; 400: formato o
  nombre inválidos. Usar data.id en las URLs.
