info:
  name: crear-cliente
  type: http
  seq: 3
http:
  method: POST
  url: "{{URL}}/api/v1/clientes"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: '{ "ruc": "1712345675001", "razonSocial": "Cliente de prueba", "sector": "Retail" }'
  auth:
    type: bearer
    token: "{{TOKEN}}"
docs: |-
  cliente.crear y perfil interno. Campo ruc admite cédula (10 dígitos) o RUC
  (13 dígitos); el verificador se valida en el SP. sector opcional. 201:
  cliente en data con estadoCambiadoEn y motivoCambioEstado; 409: identificación
  duplicada; 400: formato o nombre inválidos. Usar data.id en las URLs.
