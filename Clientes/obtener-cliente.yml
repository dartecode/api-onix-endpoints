info:
  name: obtener-cliente
  type: http
  seq: 2

http:
  method: GET
  url: "{{URL}}/api/v1/clientes/8"
  auth:
    type: bearer
    token: "{{TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Reemplazar 1 en la URL por el identificador numérico del cliente.
  cliente.ver. 200: cliente en data; 404: inexistente o fuera de alcance.
