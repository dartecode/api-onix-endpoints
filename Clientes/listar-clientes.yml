info:
  name: listar-clientes
  type: http
  seq: 1
http:
  method: GET
  url: "{{URL}}/api/v1/clientes?pagina=1&limite=20"
  auth:
    type: bearer
    token: "{{TOKEN}}"
docs: |-
  cliente.ver. Filtros opcionales: busqueda (razón social/nombre comercial/identificación),
  estado (activo/inactivo), sector (coincidencia exacta) y enPerseo (true/false).
  200: clientes en data, paginación en meta. pagina desde 1 y limite hasta 100.
  Cada cliente incluye id interno, idPerseo, enPerseo, datos fiscales/comerciales,
  sincronizadoEn y totalInstalaciones. El estado inactivo no oculta el cliente.
