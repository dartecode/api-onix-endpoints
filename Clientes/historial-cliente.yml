info:
  name: historial-cliente
  type: http
  seq: 6

http:
  method: GET
  url: "{{URL}}/api/v1/clientes/4/historial?pagina=1&limite=20"
  params:
    - name: pagina
      value: "1"
      type: query
    - name: limite
      value: "20"
      type: query
  auth:
    type: bearer
    token: "{{TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Reemplazar 1 en la URL por el identificador numérico del cliente.
  cliente.ver. Historial paginado de altas y ediciones exitosas, más
  recientes primero. Cada item: id, idUsuario, accion, fecha, motivo,
  anterior y nuevo. 200; 404: inexistente o fuera de alcance.
