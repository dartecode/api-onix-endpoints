info:
  name: historial-cliente
  type: http
  seq: 6
http:
  method: GET
  url: "{{URL}}/api/v1/clientes/1/historial?pagina=1&limite=20"
  auth:
    type: bearer
    token: "{{TOKEN}}"
docs: |-
  Reemplazar 1 en la URL por el identificador numérico del cliente.
  cliente.ver. Historial paginado de altas y ediciones exitosas, más
  recientes primero. Cada item conserva idUsuario y añade
  usuario: { id, nombre } o null, sin requerir usuario.ver; también incluye
  accion, fecha, motivo, anterior y nuevo. 200; 404: inexistente o fuera de alcance.
