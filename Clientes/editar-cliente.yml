info:
  name: editar-cliente
  type: http
  seq: 4
http:
  method: PATCH
  url: "{{URL}}/api/v1/clientes/1"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: '{ "razonSocial": "Cliente actualizado" }'
  auth:
    type: bearer
    token: "{{TOKEN}}"
docs: |-
  Reemplazar 1 en la URL por el identificador numérico del cliente.
  cliente.editar. Campos opcionales razonSocial, sector, estado
  (activo/suspendido/baja). 200: cliente en data; 404: fuera de alcance.
