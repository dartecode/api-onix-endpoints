info:
  name: listar-instalaciones
  type: http
  seq: 1
http:
  method: GET
  url: "{{URL}}/api/v1/instalaciones?pagina=1&limite=20"
  auth:
    type: bearer
    token: "{{TOKEN}}"
docs: |-
  Requiere instalacion.ver. Filtros opcionales: idCliente (entero positivo), busqueda
  (nombre, dirección o ciudad) y estado (activo/inactivo). pagina desde 1, limite hasta 100.
  200: lista en data y paginación en meta. Sin permiso: 403 FORBIDDEN.
  Con la matriz inicial, un Operador recibe 403 y un Auditor interno 200.
