info:
  name: logout
  type: http
  seq: 5

http:
  method: POST
  url: "{{URL}}/api/v1/autenticacion/cerrar-sesion"
  auth:
    type: bearer
    token: "{{TOKEN}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("sesión cerrada", function () {
            expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  # Cerrar sesión

  `POST /api/v1/autenticacion/cerrar-sesion` — revoca la sesión y su credencial de renovación y borra la
  cookie web. Después `TOKEN` y `REFRESH_TOKEN` dejan de servir.
