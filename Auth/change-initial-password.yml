info:
  name: change-initial-password
  type: http
  seq: 2

http:
  method: POST
  url: "{{URL}}/api/v1/autenticacion/cambiar-contrasena-inicial"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Onix-Client
      value: mobile
  body:
    type: json
    data: |-
      {
        "newPassword": "Nueva-Clave-2026",
        "passwordConfirmation": "Nueva-Clave-2026"
      }
  auth:
    type: bearer
    token: "{{TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  # Cambiar la contraseña del primer acceso

  `POST /api/v1/autenticacion/cambiar-contrasena-inicial` con el token **restringido** del login.
  Cuerpo `{ newPassword, passwordConfirmation }` (12–256 caracteres, distinta de la temporal).
  Revoca la sesión: después vuelve a hacer `login` con la clave nueva.

  | Código | Significado |
  | --- | --- |
  | 400 | Longitud, confirmación distinta o igual a la temporal. |
  | 401 | Token o sesión no vigentes. |
  | 403 | La sesión no es de primer acceso. |
  | 409 | La cuenta o la sesión cambió durante la operación. |
