info:
  name: me
  type: http
  seq: 3

http:
  method: GET
  url: "{{URL}}/api/v1/autenticacion/me"
  auth:
    type: bearer
    token: "{{TOKEN}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("sesión vigente", function () {
            expect(res.getStatus()).to.equal(200);
            const data = res.getBody().data;
            expect(data).to.have.property("user");
            expect(data).to.have.property("profile");
            expect(data).to.have.property("permissions");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  # Sesión actual

  `GET /api/v1/autenticacion/me` → `data`: `{ user { id, name, email }, profile, permissions[], scope { clientIds, installationIds, portfolio }, shift, sessionExpiresIn, inactivity { timeoutSeconds } }`.

  `profile` y `permissions` son códigos de la base (`administrador`, `cliente.ver`…) y se leen
  en cada petición. Los campos `null` o listas vacías son funcionalidad pendiente; una lista
  vacía **no** significa acceso global. `403 PASSWORD_CHANGE_REQUIRED` si falta el cambio inicial.
