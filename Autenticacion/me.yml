info:
  name: me
  type: http
  seq: 3

http:
  method: GET
  url: "{{URL}}/api/v1/autenticacion/me"
  auth:
    type: bearer
    token: "{{TOKEN}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("devuelve la sesión vigente", function () {
            expect(res.getStatus()).to.equal(200);
            expect(res.getBody()).to.have.property("usuario");
            expect(res.getBody()).to.have.property("perfil");
            expect(res.getBody()).to.have.property("permisos");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  # Consultar sesión actual

  `GET /api/v1/autenticacion/me` — identidad, perfil y **permisos efectivos**
  de la sesión vigente. Responde `Cache-Control: no-store`.

  ## Encabezados

  - `Authorization: Bearer <tokenAcceso>` (obligatorio).
  - `X-Onix-Client` **no** es requerido en este endpoint.

  ## Respuesta `200`

  ```json
  {
    "usuario": {
      "id": "<UUID>",
      "nombre": "operador.prueba",
      "correo": null
    },
    "perfil": "administrador",
    "permisos": ["usuario.asignarPerfil", "usuario.crear"],
    "alcance": {
      "idsClientes": [],
      "idsInstalaciones": [],
      "cartera": null
    },
    "turno": null,
    "sesionExpiraEn": null,
    "inactividad": { "limiteSegundos": null }
  }
  ```

  - `usuario.nombre` es el identificador de login (aún no hay nombre personal).
  - Permisos y perfil se leen de PostgreSQL en **cada** petición: cambiar o
    revocar permisos se refleja sin esperar a que venza el JWT.
  - Los campos `null`/vacíos (correo, alcances, turnos, inactividad,
    `sesionExpiraEn`) indican funcionalidad aún no implementada; una lista
    vacía **no** significa acceso global.

  ## Estados

  | Código | Significado |
  | --- | --- |
  | `401` | Token inválido, cuenta deshabilitada o sesión revocada/reemplazada. |
  | `403` | Cambio inicial de contraseña pendiente (sesión restringida). |
