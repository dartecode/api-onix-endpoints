info:
  name: cambiar-contrasena
  type: http
  seq: 2

http:
  method: POST
  url: "{{URL}}/api/v1/autenticacion/cambiar-contrasena-inicial"
  headers:
    - name: X-Onix-Client
      value: web
      description: Transporte de la credencial de renovación; acepta web o mobile
    - name: Content-Type
      value: application/json
      description: Formato del cuerpo JSON
  body:
    type: json
    data: |-
      {
        "nuevaContrasena": "Nueva-Clave-2026",
        "confirmacionContrasena": "Nueva-Clave-2026"
      }
  auth:
    type: bearer
    token: "{{TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  # Cambiar contraseña inicial (primer acceso)

  `POST /api/v1/autenticacion/cambiar-contrasena-inicial`

  Requiere el **Bearer restringido** que devuelve el login cuando
  `requiereCambioContrasena` es `true`. No funciona con una sesión normal.

  ## Cuerpo

  | Campo | Tipo | Reglas |
  | --- | --- | --- |
  | `nuevaContrasena` | string | 12 a 256 caracteres; sin recorte de espacios. |
  | `confirmacionContrasena` | string | Debe coincidir exactamente. |

  - No debe ser igual a la contraseña temporal actual.
  - No se exigen mayúsculas/números/símbolos todavía.
  - Se rechazan campos adicionales.

  ## Respuesta `200`

  ```json
  { "mensaje": "..." }
  ```

  El cambio actualiza el hash **y revoca la sesión** en una sola transacción.
  No emite tokens: después hay que volver a `iniciar-sesion` con la clave nueva.

  ## Estados

  | Código | Significado |
  | --- | --- |
  | `400` | Clave fuera de 12–256, confirmación distinta, reutilización de la clave temporal o datos inválidos. |
  | `401` | Token o sesión no vigentes. |
  | `403` | La sesión no es la del primer acceso (ya se cambió o es normal). |
  | `409` | La cuenta o sesión cambió durante el cálculo del hash. |
