info:
  name: cambiar-contrasena-inicial
  type: http
  seq: 2

http:
  method: POST
  url: "{{URL}}/api/v1/autenticacion/cambiar-contrasena-inicial"
  headers:
    - name: X-Onix-Client
      value: web
      description: Transporte de la credencial de renovación; acepta web o mobile
    - name: Content-Type
      value: application/json
      description: Formato del cuerpo JSON
  body:
    type: json
    data: |-
      {
        "nuevaContrasena": "Supervisor12",
        "confirmacionContrasena": "Supervisor12"
      }
  auth:
    type: bearer
    token: "{{TOKEN}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const data = res.getStatus() === 200 && body.success ? body.data : null;
        if (data) {
          bru.setEnvVar("TOKEN", data.tokenAcceso ?? "");
          bru.setEnvVar("ID_DESAFIO", data.idDesafio ?? "");
          if (data.tokenRenovacion) bru.setEnvVar("TOKEN_RENOVACION", data.tokenRenovacion);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  # Cambiar contraseña inicial (primer acceso)

  `POST /api/v1/autenticacion/cambiar-contrasena-inicial`

  Requiere el **Bearer restringido** que devuelve el login cuando
  `data.paso` es `cambio_contrasena`. No funciona con una sesión normal.

  ## Cuerpo

  | Campo | Tipo | Reglas |
  | --- | --- | --- |
  | `nuevaContrasena` | string | 8 a 256 caracteres, minúscula, mayúscula y número o símbolo; sin recorte de espacios. |
  | `confirmacionContrasena` | string | Debe coincidir exactamente. |

  - No debe ser igual a la contraseña temporal actual.
  - Los espacios no cuentan como carácter especial.
  - Se rechazan campos adicionales.

  ## Respuesta `200`

  Devuelve el siguiente paso del mismo flujo, sin pedir de nuevo usuario y contraseña:

  - `configurar_mfa`: TOKEN contiene una sesión restringida nueva.
  - `mfa`: ID_DESAFIO contiene el desafío del MFA ya configurado.
  - `sesion`: TOKEN contiene la sesión completa.

  En móvil también actualiza TOKEN_RENOVACION. En web Bruno recibe la renovación en
  la cookie HttpOnly. La sesión anterior queda revocada.

  ## Estados

  | Código | Significado |
  | --- | --- |
  | `400` | Clave fuera de 8–256, composición inválida, confirmación distinta, reutilización de la clave temporal o datos inválidos. |
  | `401` | Token o sesión no vigentes. |
  | `403` | La sesión no es la del primer acceso (ya se cambió o es normal). |
  | `409` | La cuenta o sesión cambió durante el cálculo del hash. |
