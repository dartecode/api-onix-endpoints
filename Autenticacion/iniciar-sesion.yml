info:
  name: iniciar-sesion
  type: http
  seq: 1

http:
  method: POST
  url: "{{URL}}/api/v1/autenticacion/iniciar-sesion"
  headers:
    - name: Content-Type
      value: application/json
      description: Formato del cuerpo JSON
    - name: X-Onix-Client
      value: web
      description: Transporte de la credencial de renovación; acepta web o mobile
  body:
    type: json
    data: |-
      {
        "usuario": "test",
        "contrasena": "abcdefgh"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Successful POST request", function () {
            expect(res.getStatus()).to.be.oneOf([200, 201]);
        });

        let response = res.getBody();
        bru.setEnvVar("TOKEN", response.tokenAcceso);

        if (response.requiereCambioContrasena) {
            console.log("Atención: primer acceso pendiente; ejecutar cambiar-contrasena-inicial antes de /me.");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  # Iniciar sesión

  `POST /api/v1/autenticacion/iniciar-sesion`

  ## Cuerpo

  | Campo | Tipo | Notas |
  | --- | --- | --- |
  | `usuario` | string | Nombre de cuenta. |
  | `contrasena` | string | Debe coincidir con el hash guardado. |

  ## Encabezados

  - `X-Onix-Client` (**obligatorio**): `web` o `mobile`.
  - `Content-Type: application/json`.

  ## Respuesta `200`

  ```json
  {
    "tipoToken": "Bearer",
    "tokenAcceso": "<JWT 10 min>",
    "expiraEn": 600,
    "requiereCambioContrasena": false,
    "usuario": { "id": "<UUID>", "usuario": "test", "idRol": 1 }
  }
  ```

  - `expiraEn=600` es la validez del JWT, **no** un límite de sesión.
  - Con `X-Onix-Client: mobile` se agrega `tokenRenovacion` en el JSON; con `web`
    la renovación sale en cookie HttpOnly (no se ve en el cuerpo).
  - Si `requiereCambioContrasena` es `true`, el token quedará restringido hasta
    completar `cambiar-contrasena-inicial`.
  - La cookie y el token se guardan en la variable de entorno `TOKEN`.

  ## Estados

  | Código | Significado |
  | --- | --- |
  | `400` | Datos o `X-Onix-Client` inválidos. |
  | `401` | Usuario o contraseña incorrectos. |
  | `403` | Cuenta bloqueada o deshabilitada. |

  ## Notas

  - Una sola sesión activa por usuario: este login **revoca** la sesión anterior,
    también si se usa un dispositivo distinto.
  - La contraseña del ejemplo (`abcdefgh`) es la cuenta local actual; cámbiala
    aquí si tu cuenta usa otra clave (las contraseñas nuevas ya exigen 12+ caracteres).
