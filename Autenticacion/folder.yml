docs: |-
  # Autenticación

  Endpoints de login, primer acceso y consulta de sesión.

  ## Flujo

  1. `iniciar-sesion` → `tokenAcceso` (Bearer, 10 min de validez) y, en móvil,
     `tokenRenovacion` en JSON. En web la renovación llega en cookie HttpOnly.
  2. Si `requiereCambioContrasena` es `true`, el Bearer es **restringido**: solo
     sirve para `cambiar-contrasena-inicial`. `/me` y el resto devuelven `403`.
  3. Tras el cambio la sesión se revoca: volver a `iniciar-sesion` y usar el
     nuevo login para `/me` y el resto de la colección.
  4. `me` devuelve la sesión vigente con permisos efectivos.

  ## Encabezado `X-Onix-Client`

  Obligatorio en `iniciar-sesion` y `cambiar-contrasena-inicial`; acepta `web`
  o `mobile`. Solo elige el transporte del token de renovación; **no cambia
  permisos**. Un login en otro dispositivo reemplaza la sesión anterior.

  ## Estados comunes

  | Código | Significado |
  | --- | --- |
  | `400` | Datos o encabezado de cliente inválidos. |
  | `401` | Credenciales, token o sesión no vigentes. |
  | `403` | Cuenta bloqueada/deshabilitada o cambio inicial pendiente. |
  | `409` | Conflicto de cuenta o sesión durante el cálculo (raro). |
