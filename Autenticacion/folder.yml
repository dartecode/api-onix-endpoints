info:
  name: Autenticacion
  type: folder
  seq: 2

request:
  auth: inherit

docs:
  content: |-
    Login y MFA emiten data.paso; TOKEN guarda data.tokenAcceso.
    Inicial requiere cambio_contrasena; cambio propio y me requieren sesión completa.
    X-Onix-Client obligatorio en login, renovar y mfa-verificar (web o mobile).
    Renovación web por cookie, móvil por data.tokenRenovacion.
    El cambio inicial continúa a configurar_mfa, mfa o sesion sin repetir credenciales.
    El cambio voluntario de contraseña y el cierre sí terminan la sesión.
  type: text/markdown
