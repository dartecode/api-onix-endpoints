name: ONIX LOCAL
variables:
  - name: URL
    value: http://localhost:3000
    description: Base del API local, sin barra final (los endpoints usan {{URL}}/api/v1/...)
  - name: TOKEN
    value: ""
    description: accessToken de la última sesión; lo guardan login y refresh
  - name: REFRESH_TOKEN
    value: ""
    description: refreshToken móvil; lo guardan login y refresh con X-Onix-Client mobile
  - name: USERNAME
    value: admin.local
    description: Cuenta local creada con pnpm db:seed
  - name: PASSWORD
    value: ""
    description: Contraseña de tu cuenta local. Complétala solo en tu copia; no la subas.
