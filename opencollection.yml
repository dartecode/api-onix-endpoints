info:
  name: OnixApi
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
docs: |-
  # Onix API — colección local

  Colección para probar el API contra `http://localhost:3000/api/v1` (entorno `ONIX LOCAL`).
  Antes de empezar, completa `PASSWORD` en el entorno (solo en tu copia).

  ## Orden de ejecución

  1. **Health › ready** — comprueba API y PostgreSQL.
  2. **Auth › login** — guarda `TOKEN` (y `REFRESH_TOKEN` en móvil). `X-Onix-Client` es obligatorio.
  3. **Auth › change-initial-password** — solo si `requiresPasswordChange` es `true`; luego login otra vez.
  4. **Auth › me** — perfil y permisos efectivos.
  5. **Clients** — ejemplo con procedimientos almacenados simulados (mock).
  6. **Users › create-user** — requiere `usuario.crear` y `usuario.asignarPerfil`.
  7. **Auth › refresh / logout**.

  ## Formato de respuesta

  Éxito: `{ success, statusCode, data, meta?, path, timestamp }`. Error:
  `{ success: false, statusCode, code, message, details? }`. Los scripts leen `res.getBody().data`.
  Rutas en español (menos /health); campos en inglés; perfiles y permisos son códigos de la base en español.

  ## Documentación ejecutable

  - Portada: http://localhost:3000/
  - Swagger: http://localhost:3000/api/v1/docs
  - OpenAPI JSON: http://localhost:3000/api/v1/openapi.json
