info:
  name: mfa-totp
  type: http
  seq: 4

http:
  method: POST
  url: "{{URL}}/api/v1/autenticacion/mfa/totp"
  auth:
    type: bearer
    token: "{{TOKEN}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const data = res.getStatus() === 201 && body.success ? body.data : null;
        if (data?.idDesafio) bru.setEnvVar("ID_DESAFIO", data.idDesafio);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Sesión completa o configurar_mfa. Sin cuerpo. Devuelve data.idDesafio,
  qr y claveManual. El script guarda idDesafio en ID_DESAFIO; escanear el QR.
  La configuración no cambia hasta confirmar. No compartir QR ni clave.
