info:
  name: mfa-correo
  type: http
  seq: 3

http:
  method: POST
  url: "{{URL}}/api/v1/autenticacion/mfa/correo"
  auth:
    type: bearer
    token: "{{TOKEN}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const data = res.getStatus() === 201 && body.success ? body.data : null;
        if (data?.idDesafio) bru.setEnvVar("ID_DESAFIO", data.idDesafio);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Sesión completa o configurar_mfa. Sin cuerpo. Envía código y devuelve
  data.idDesafio: el script lo guarda en ID_DESAFIO para mfa-confirmar.
