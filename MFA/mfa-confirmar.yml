info:
  name: mfa-confirmar
  type: http
  seq: 5

http:
  method: POST
  url: "{{URL}}/api/v1/autenticacion/mfa/confirmar"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Onix-Client
      value: web
      description: Obligatorio; cambiar a mobile para recibir tokenRenovacion en JSON
  body:
    type: json
    data: |-
      {
        "idDesafio": "{{ID_DESAFIO}}",
        "codigo": "748522"
      }
  auth:
    type: bearer
    token: "{{TOKEN}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const data = res.getStatus() === 200 && body.success ? body.data : null;
        if (data?.tokenAcceso) bru.setEnvVar("TOKEN", data.tokenAcceso);
        if (data?.tokenRenovacion) bru.setEnvVar("TOKEN_RENOVACION", data.tokenRenovacion);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Confirma enrolamiento correo/TOTP (no desafío de login). Sesión completa
  o configurar_mfa. Desde Mi cuenta responde data.mensaje y conserva la sesión.
  Desde configurar_mfa responde paso=sesion, reemplaza TOKEN por el de la sesión
  completa y continúa sin volver al login. En web actualiza la cookie; en móvil,
  TOKEN_RENOVACION. 401: código o desafío inválido.
