info:
  name: resumen-auditoria
  type: http
  seq: 3
http:
  method: GET
  url: "{{URL}}/api/v1/auditoria/resumen?desde=2026-11-01T00:00:00Z"
  params:
    - name: desde
      value: "2026-11-01T00:00:00Z"
      type: query
    - name: hasta
      value: "2026-11-27T23:59:59Z"
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{TOKEN}}"
docs: |-
  Requiere auditoria.ver. Solo recibe desde y hasta, no los demás filtros de la lista.
  Desde obligatorio; hasta opcional (ahora). Ajustar el ejemplo; intervalo inclusivo
  de hasta 366 días. No añadir pagina, limite, accion, grupo ni IDs a esta petición.
  200: data {registros, accesosImagenes, descargasExportaciones, denegados, cadena}.
  Los contadores respetan el alcance del actor. accesosImagenes vale 0 hasta implementar
  video; descargasExportaciones cuenta actualmente AUDITORIA_EXPORTADA.
  cadena: integra, alterada o sin_verificar. Recalcula las huellas del intervalo físico
  completo y compara cada enlace con su predecesor real, no solo las filas visibles.
  Con más de AUDIT_INTEGRITY_MAX_RECORDS (10000 por defecto), o sin permisos de alcance,
  devuelve sin_verificar. No existe un proceso nocturno que complete esta comprobación.
  Integra significa que las filas examinadas coinciden; no certifica custodia externa.
  El encadenamiento no detecta por sí solo eliminar el final o recalcular toda la cadena
  mediante acceso SQL privilegiado. No modificar datos como parte del uso normal de Bruno.
  400 VALIDATION_ERROR o AUDIT_INVALID_RANGE; sin auditoria.ver: 403 FORBIDDEN auditado.
