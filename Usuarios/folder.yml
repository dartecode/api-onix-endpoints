docs: |-
  # Usuarios

  Creación de cuentas con contraseña temporal y cambio inicial obligatorio.

  ## Permisos

  El endpoint exige una sesión completa (no restringida) con **ambos** permisos:

  - `usuario.crear`
  - `usuario.asignarPerfil`

  Además, el `perfil` solicitado debe estar en la lista de perfiles asignables
  por el perfil del actor (el administrador provisional puede asignar los diez
  perfiles base). Si no está permitido: `403`.

  ## Cuentas sin permisos

  El seed crea cuentas con perfil `sinAsignar` (sin permisos). Para aprovisionar
  una administradora existente, desde la raíz del proyecto:

  ```bash
  pnpm db:bootstrap-admin <usuario>
  ```

  Asigna el perfil administrador, lo audita y revoca sus sesiones (habrá que
  iniciar sesión de nuevo). No cambia la contraseña.

  ## Estados

  | Código | Significado |
  | --- | --- |
  | `201` | Cuenta creada y auditada (misma transacción). |
  | `400` | Datos inválidos, contraseña fuera de 12–256 o campos adicionales. |
  | `401` | Token o sesión no vigentes. |
  | `403` | Sesión restringida, permisos insuficientes o perfil no asignable. |
  | `409` | El nombre de usuario ya existe. |
