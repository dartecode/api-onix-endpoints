info:
  name: Usuarios
  type: folder
  seq: 4

request:
  auth:
    type: bearer
    token: "{{TOKEN}}"

docs:
  content: |-
    Sesión completa y permisos por operación. Crear exige usuario.crear y
    usuario.asignarPerfil; consultar usuario.ver; editar, estado y restablecer
    usuario.editar; MFA usuario.gestionarMfa. La base comprueba el alcance.
    El API genera las temporales para alta/restablecimiento y las envía por correo.
    El primer administrador se crea con BDOnix/semillas/admin_inicial.sql y
    el hash de pnpm admin:hash, según APIOnix/docs/PRIMER-ADMIN.md.
  type: text/markdown
