info:
  name: Usuarios
  type: folder
  seq: 4

request:
  auth:
    type: bearer
    token: "{{TOKEN}}"

docs:
  content: |-
    Sesión completa y permisos por operación. Crear exige usuario.crear y
    usuario.asignarPerfil; consultar usuario.ver; editar, estado y restablecer
    usuario.editar; MFA usuario.reiniciarMfa. El API comprueba el alcance.
    El API genera las temporales para alta/restablecimiento y las envía por correo.
    El primer superadministrador se crea con la semilla Prisma y ONIX_ADMIN_*,
    según APIOnix/docs/operacion/PRIMER-ADMIN.md. No se usan semillas de la base histórica.
  type: text/markdown
