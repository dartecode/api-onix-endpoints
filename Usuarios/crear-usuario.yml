info:
  name: crear-usuario
  type: http
  seq: 1

http:
  method: POST
  url: "{{URL}}/api/v1/usuarios"
  headers:
    - name: Content-Type
      value: application/json
      description: Formato del cuerpo JSON
    - name: X-Onix-Client
      value: web
      description: Origen de la operación para la auditoría; acepta web o mobile
  body:
    type: json
    data: |-
      {
        "usuario": "operador.prueba2",
        "contrasenaTemporal": "Temporal-Pruebas-2026",
        "perfil": "operador"
      }
  auth:
    type: bearer
    token: "{{TOKEN}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("crea la cuenta con 201", function () {
            expect(res.getStatus()).to.equal(201);
            expect(res.getBody()).to.have.property("usuario");
            expect(res.getBody().requiereCambioContrasena).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  # Crear usuario

  `POST /api/v1/usuarios` — crea una cuenta con contraseña temporal. La cuenta
  y su registro de auditoría se guardan en **la misma transacción**; si falla la
  auditoría, no se crea la cuenta. Responde `Cache-Control: no-store`.

  ## Cuerpo

  | Campo | Tipo | Reglas |
  | --- | --- | --- |
  | `usuario` | string | 1–100 caracteres, sin espacios. |
  | `contrasenaTemporal` | string | 12 a 256 caracteres. |
  | `perfil` | string | Uno de los perfiles asignables (ver abajo). |

  No se aceptan `idRol`, `permisos`, `habilitado`, `bloqueado` ni
  `requiereCambioContrasena` en el cuerpo.

  Perfiles asignables: `administrador`, `supervisor`, `operador`, `tecnico`,
  `gerencia`, `clienteAdministrador`, `clienteResponsableInstalacion`,
  `clienteConsulta`, `auditorInterno`, `dpd`.

  ## Encabezados

  - `Authorization: Bearer <tokenAcceso>` con sesión completa.
  - `X-Onix-Client` (obligatorio): `web` o `mobile`; se registra en la auditoría.

  ## Respuesta `201`

  ```json
  {
    "usuario": {
      "id": "<UUID>",
      "nombre": "operador.prueba2",
      "correo": null
    },
    "perfil": "operador",
    "requiereCambioContrasena": true
  }
  ```

  No devuelve tokens, contraseña ni hash. La cuenta nueva debe completar
  `cambiar-contrasena-inicial` antes de usar `/me` o endpoints protegidos.

  ## Estados

  | Código | Significado |
  | --- | --- |
  | `400` | Datos inválidos, contraseña fuera de 12–256 caracteres o campos adicionales. |
  | `401` | Token o sesión no vigentes. |
  | `403` | Cambio inicial pendiente, permisos insuficientes o perfil no asignable. |
  | `409` | El nombre de usuario ya existe (también ante creaciones simultáneas). |

  ## Auditoría

  Se registran actor, sesión, acción, resultado, fecha, IP de conexión y
  aplicación web/móvil. Nunca se guardan contraseñas ni hashes.
