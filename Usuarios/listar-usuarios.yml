info:
  name: listar-usuarios
  type: http
  seq: 4
http:
  method: GET
  url: "{{URL}}/api/v1/usuarios?pagina=1&limite=20&idCliente=1"
  auth:
    type: bearer
    token: "{{TOKEN}}"
docs: |-
  usuario.ver. Reemplazar idCliente por el identificador numérico del cliente
  o quitarlo para listar todo el alcance. Se combina con busqueda, perfil y
  estado (activo/inactivo). Un cliente sin usuarios devuelve data vacío y no 404.
  200: registros en data y paginación en meta. Copiar UUID del objetivo.
