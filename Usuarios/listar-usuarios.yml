http:
  method: GET
  url: "{{URL}}/api/v1/usuarios?pagina=1&limite=20&idCliente=1"
  auth:
    type: bearer
    token: "{{TOKEN}}"
docs: |-
  usuario.ver. Filtros opcionales busqueda, perfil, estado (activo/inactivo)
  e idCliente. 200: registros en data (incluyen cliente y sesionActiva) y
  paginación en meta. Copiar UUID del objetivo.
