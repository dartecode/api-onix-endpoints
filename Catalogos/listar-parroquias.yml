info:
  name: listar-parroquias
  type: http
  seq: 3
http:
  method: GET
  url: "{{URL}}/api/v1/catalogos/cantones/1701/parroquias"
  auth:
    type: bearer
    token: "{{TOKEN}}"
docs: |-
  Reemplazar 1701 por el id de data obtenido en listar-cantones. Sin cuerpo.
  Exige sesión completa con TOKEN y perfil de tipo interno; no requiere permiso propio.
  200: data es una lista sin paginar de { id, nombre } de las parroquias de ese cantón.
  En el ambiente verificado, el cantón 1701 (Quito) tiene 70 parroquias; usar el catálogo
  local para obtener los IDs vigentes de cada ambiente.
  400 VALIDATION_ERROR: id no numérico. 404 CANTON_NOT_FOUND: cantón inexistente.
  401: token ausente, expirado o sesión no vigente/completa. 403 FORBIDDEN: perfil no interno.
