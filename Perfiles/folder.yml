  content: |-
    Permisos y matrices gestionados con Prisma; preparar migraciones y semilla de APIOnix.
    Consultar exige perfil.ver; reemplazar exige perfil.editar.
    Cada cambio real revoca las sesiones del perfil afectado, incluida la del actor.
