info:
  name: catalogo-permisos
  type: http
  seq: 2
http:
  method: GET
  url: "{{URL}}/api/v1/permisos"
  auth:
    type: bearer
    token: "{{TOKEN}}"
docs: |-
  Requiere perfil.ver. 200: data es una lista sin paginación con codigo, nombre y modulo.
  Incluye catalogo.sincronizar, asignado inicialmente solo al Superadministrador.
  La semilla lo retira del Administrador existente y revoca sus sesiones si cambia la matriz.
  La autorización depende de la matriz editable; el catálogo de permisos no representa la
  asignación de cada perfil. Consultar listar-perfiles para comprobar las matrices.
  La sincronización de clientes usa cliente.sincronizar.
  El módulo Auditoría añade auditoria.ver, auditoria.exportar, auditoria.verTodo,
  auditoria.verConfiguracion y auditoria.verDatosPersonales. Consultar listar-perfiles
  para ver asignaciones y README.md, sección Auditoría, para alcance y exportación.
