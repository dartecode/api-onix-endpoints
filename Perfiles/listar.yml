info:
  name: listar-perfiles
  type: http
  seq: 1
http:
  method: GET
  url: "{{URL}}/api/v1/perfiles"
  auth:
    type: bearer
    token: "{{TOKEN}}"
docs: |-
  Requiere perfil.ver. 200: data es una lista sin paginación con codigo,
  nombre, tipo, mfaRequerido y permisos.
  Para auditoría comprobar auditoria.ver, auditoria.exportar y los permisos de alcance:
  verTodo en Auditor/Gerencia, verConfiguracion en Administrador y verDatosPersonales
  en DPD; Superadministrador recibe todo el catálogo. Los alcances se suman.
  Operador, Técnico, Supervisor y clientes no reciben permisos de auditoría inicialmente.
