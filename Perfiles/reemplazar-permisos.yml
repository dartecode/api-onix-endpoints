info:
  name: reemplazar-permisos-perfil
  type: http
  seq: 3
http:
  method: PUT
  url: "{{URL}}/api/v1/perfiles/operador/permisos"
  headers:
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "permisos": [
          "cliente.ver",
          "camara.ver",
          "incidente.ver",
          "dispositivo.ver",
          "reporte.crear"
        ]
      }
docs: |-
  Requiere perfil.editar. Reemplaza la lista completa, no agrega permisos.
  Modificar el ejemplo según la matriz deseada antes de enviarlo.
  El ejemplo muestra la matriz inicial del Operador sin instalacion.ver; consultar listar-perfiles
  y conservar sus demás permisos actuales si solo se quiere retirar ese permiso.
  En bases existentes la semilla retira instalacion.ver de operador, gerencia, dpd,
  clienteAdministrador, clienteResponsableInstalacion y clienteConsulta; también usuario.ver
  de gerencia y dpd y catalogo.sincronizar del Administrador. Revoca sesiones si cambia la matriz.
  No hace falta enviar este PUT para esos retiros. Si se vuelven a conceder aquí, la siguiente
  semilla los quitará otra vez. Los permisos adicionales no incluidos en los retiros se conservan.
  La semilla rellena permisos iniciales ausentes salvo retiro manual registrado en auditoría.
  Ver Catálogo geográfico, Permisos y matrices existentes y Usuarios y permisos de consulta
  en README.md.
  200: data es el perfil actualizado. Si hay cambios cierra sus sesiones.
  400 VALIDATION_ERROR: formato/repetidos; PERMISO_INVALIDO: details con códigos desconocidos.
  403 FORBIDDEN: sin permiso o intento de quitar cualquier permiso del catálogo al superadmin.
  El administrador tiene una matriz editable; no tiene permisos protegidos.
  Auditoría: auditoria.ver habilita la consulta; verTodo, verConfiguracion y
  verDatosPersonales (con prefijo auditoria.) se suman para limitar las filas visibles.
  Con auditoria.ver sin alcance la lista queda vacía. Exportar requiere además
  auditoria.exportar. Conservar todos los permisos actuales al modificar esos alcances.
  404 PERFIL_INVALIDO: perfil inexistente.
