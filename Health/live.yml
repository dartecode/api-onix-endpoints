info:
  name: live
  type: http
  seq: 1

http:
  method: GET
  url: "{{URL}}/api/v1/health/live"
  auth: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("live", function () {
            expect(res.getStatus()).to.equal(200);
            expect(res.getBody().data.status).to.equal("ok");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
